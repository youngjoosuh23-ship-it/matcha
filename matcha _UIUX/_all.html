<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>capture-all</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0d1c14; overflow: hidden; }
  /* Use a fixed 1920x1080-ish "stage" that mirrors PPT slide size; the screenshot tool can downscale */
  #stage {
    width: 1920px; height: 1080px;
    display: grid;
    grid-template-columns: repeat(4, 390px);
    gap: 36px;
    align-content: center;
    justify-content: center;
    padding: 90px 0;
    box-sizing: border-box;
    transform-origin: top left;
  }
  .phone {
    width: 390px; height: 760px;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 10px #0a0a0a, 0 0 0 11px rgba(255,255,255,0.08);
    position: relative;
  }
  .phone::before {
    content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #050505; border-radius: 0 0 18px 18px; z-index: 10;
  }
  .label { color: rgba(255,255,255,0.55); font-family: 'Plus Jakarta Sans','Noto Sans KR',sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; margin-top: 22px; }
  .cell { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="logo.jsx"></script>
<script type="text/babel" src="screens/login.jsx"></script>
<script type="text/babel" src="screens/map.jsx"></script>
<script type="text/babel" src="screens/chat.jsx"></script>
<script type="text/babel" src="screens/profile.jsx"></script>
<script type="text/babel">
function App() {
  // Scale the stage to fit the actual viewport
  React.useEffect(() => {
    const fit = () => {
      const stage = document.getElementById('stage');
      if (!stage) return;
      const sx = window.innerWidth / 1920;
      const sy = window.innerHeight / 1080;
      const s = Math.min(sx, sy);
      stage.style.transform = `scale(${s})`;
      document.body.style.width = (1920 * s) + 'px';
      document.body.style.height = (1080 * s) + 'px';
    };
    fit();
    window.addEventListener('resize', fit);
  }, []);
  return (
    <div id="stage">
      <div className="cell"><div className="phone"><LoginScreen/></div><div className="label">01 — Sign in</div></div>
      <div className="cell"><div className="phone"><MapScreen/></div><div className="label">02 — Map · Nearby</div></div>
      <div className="cell"><div className="phone"><ChatScreen/></div><div className="label">03 — Chat</div></div>
      <div className="cell"><div className="phone"><ProfileScreen/></div><div className="label">04 — Profile</div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
