<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>capture</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 390px; height: 760px; overflow: hidden; background: transparent; }
  #root, .phone { width: 390px; height: 760px; }
  .phone { border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 0 0 10px #0a0a0a, 0 0 0 11px rgba(255,255,255,0.08); }
  .phone::before {
    content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #050505; border-radius: 0 0 18px 18px; z-index: 10;
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="logo.jsx"></script>
<script type="text/babel" src="screens/login.jsx"></script>
<script type="text/babel" src="screens/map.jsx"></script>
<script type="text/babel" src="screens/chat.jsx"></script>
<script type="text/babel" src="screens/profile.jsx"></script>
<script type="text/babel">
const params = new URLSearchParams(location.search);
const which = params.get('s') || 'login';
const screens = { login: LoginScreen, map: MapScreen, chat: ChatScreen, profile: ProfileScreen };
const C = screens[which];
ReactDOM.createRoot(document.getElementById('root')).render(<div className="phone"><C/></div>);

window.__capture = async () => {
  await new Promise(r => setTimeout(r, 1200));
  const node = document.querySelector('.phone');
  const dataUrl = await htmlToImage.toPng(node, {
    width: 390, height: 760, pixelRatio: 3,
    cacheBust: true,
    style: { transform: 'none' }
  });
  return dataUrl;
};
</script>
</body>
</html>
