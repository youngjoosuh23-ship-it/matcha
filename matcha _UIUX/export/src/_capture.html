<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Matcha · Static Layout</title>
<meta name="viewport" content="width=1800"/>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; background: #0d1c14; font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif; padding: 60px 40px; }
  .grid { display: grid; grid-template-columns: repeat(4, 390px); gap: 32px; justify-content: center; }
  .phone {
    width: 390px; height: 760px;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 10px #0a0a0a, 0 0 0 11px rgba(255,255,255,0.08);
    position: relative;
  }
  .phone::before {
    content: "";
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #050505; border-radius: 0 0 18px 18px;
    z-index: 10;
  }
  .label { color: rgba(255,255,255,0.6); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; text-align: center; margin-top: 18px; }
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <defs>
      <radialGradient id="bg" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#c8dfb1"/>
        <stop offset="60%" stop-color="#6b9b5f"/>
        <stop offset="100%" stop-color="#1f3e2a"/>
      </radialGradient>
    </defs>
    <rect width="400" height="400" fill="url(#bg)"/>
    <text x="200" y="220" text-anchor="middle" fill="white" font-family="system-ui" font-weight="800" font-size="42">Matcha</text>
  </svg>
</template>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="logo.jsx"></script>
<script type="text/babel" src="screens/login.jsx"></script>
<script type="text/babel" src="screens/map.jsx"></script>
<script type="text/babel" src="screens/chat.jsx"></script>
<script type="text/babel" src="screens/profile.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <div className="grid">
      <div><div className="phone"><LoginScreen/></div><div className="label">01 — Sign in</div></div>
      <div><div className="phone"><MapScreen/></div><div className="label">02 — Map · Nearby</div></div>
      <div><div className="phone"><ChatScreen/></div><div className="label">03 — Chat</div></div>
      <div><div className="phone"><ProfileScreen/></div><div className="label">04 — Profile</div></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
