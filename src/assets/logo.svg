<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="112" r="86" fill="#b8d988"/>

  <!-- Bowl body -->
  <path d="M40 128 C42 172 68 192 100 192 C132 192 158 172 160 128 Z" fill="#4e7228"/>

  <!-- Bowl rim -->
  <ellipse cx="100" cy="128" rx="60" ry="17" fill="#5f8a32"/>

  <!-- Matcha surface -->
  <ellipse cx="100" cy="126" rx="53" ry="13" fill="#7fb33e"/>

  <!-- Matcha foam texture -->
  <ellipse cx="88" cy="124" rx="18" ry="6" fill="#92c44a" opacity="0.7"/>
  <ellipse cx="112" cy="126" rx="14" ry="5" fill="#92c44a" opacity="0.6"/>
  <circle cx="103" cy="122" r="5" fill="#a0cc52" opacity="0.5"/>

  <!-- White speckle dots on bowl -->
  <circle cx="66" cy="155" r="3.5" fill="white" opacity="0.4"/>
  <circle cx="80" cy="176" r="2.5" fill="white" opacity="0.35"/>
  <circle cx="100" cy="183" r="4" fill="white" opacity="0.3"/>
  <circle cx="122" cy="172" r="3" fill="white" opacity="0.35"/>
  <circle cx="136" cy="153" r="3.5" fill="white" opacity="0.4"/>

  <!-- Whisk handle -->
  <rect x="126" y="86" width="13" height="66" rx="6.5" fill="#c49040" transform="rotate(18, 132, 119)"/>

  <!-- Whisk bristles -->
  <g stroke="#c49040" stroke-width="1.3" stroke-linecap="round">
    <line x1="105" y1="133" x2="122" y2="118"/>
    <line x1="107" y1="137" x2="124" y2="122"/>
    <line x1="103" y1="130" x2="120" y2="115"/>
    <line x1="109" y1="140" x2="126" y2="125"/>
    <line x1="111" y1="143" x2="128" y2="128"/>
    <line x1="113" y1="146" x2="130" y2="131"/>
  </g>

  <!-- Whisk bristle base -->
  <ellipse cx="119" cy="127" rx="10" ry="6" fill="#a07030" transform="rotate(18, 119, 127)" opacity="0.6"/>

  <!-- Green steam bubbles -->
  <circle cx="82" cy="115" r="7" fill="#7fb33e" opacity="0.65"/>
  <circle cx="94" cy="104" r="5" fill="#7fb33e" opacity="0.55"/>
  <circle cx="71" cy="108" r="5.5" fill="#7fb33e" opacity="0.5"/>

  <!-- Ghost body (head) -->
  <ellipse cx="68" cy="86" rx="30" ry="32" fill="#f2f0e0"/>

  <!-- Ghost bottom wavy skirt -->
  <path d="M38 98 L38 115
    Q43 126 50 115
    Q57 126 64 115
    Q71 126 78 115
    Q85 126 92 115
    Q97 126 98 115
    L98 98
    Q90 68 68 66
    Q44 68 38 90 Z" fill="#f2f0e0"/>

  <!-- Ghost eyes -->
  <ellipse cx="58" cy="87" rx="4.5" ry="5.5" fill="#333"/>
  <ellipse cx="77" cy="87" rx="4.5" ry="5.5" fill="#333"/>

  <!-- Eye shine -->
  <circle cx="60" cy="85" r="1.8" fill="white"/>
  <circle cx="79" cy="85" r="1.8" fill="white"/>

  <!-- Ghost smile -->
  <path d="M59 98 Q68 107 78 98" stroke="#333" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <ellipse cx="50" cy="96" rx="6" ry="4" fill="#ffaaaa" opacity="0.3"/>
  <ellipse cx="86" cy="96" rx="6" ry="4" fill="#ffaaaa" opacity="0.3"/>

  <!-- Sparkle large -->
  <path d="M106 58 L109 49 L112 58 L121 61 L112 64 L109 73 L106 64 L97 61 Z" fill="white" opacity="0.95"/>

  <!-- Sparkle small -->
  <path d="M121 44 L123 39 L125 44 L130 46 L125 48 L123 53 L121 48 L116 46 Z" fill="white" opacity="0.8"/>
</svg>
